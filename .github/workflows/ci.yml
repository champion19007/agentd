name: PR Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-vet:
    name: 1. Lint and Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi
      - name: Go Vet
        run: go vet ./...
      - name: Verify tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  architecture:
    name: 2. Architecture & Import Graph
    needs: [lint-vet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify Core Boundaries & Clock Invariants
        run: go test -v -count=1 ./tests -run "TestCoreDoesNot"

  unit:
    name: 3. Unit Tests
    needs: [architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Core Domain & Policies
        run: go test -v -count=1 ./internal/core/...
      - name: Adapters & Config
        run: go test -v -count=1 ./internal/adapters/... ./internal/config/...
      - name: Store, CLI & API
        run: go test -v -count=1 ./internal/store/... ./internal/cli/... ./internal/api/... ./internal/plugins/...

  fixture:
    name: 4. Fixture Corpus
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Golden Fixtures (50+ HTML scenarios)
        run: go test -v -count=1 ./tests -run "TestFixtureCorpus|GoldenFixtureCorpus"

  integration:
    name: 5. Integration Pipeline
    needs: [fixture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Scripted Model Pipeline Scenarios
        run: go test -v -count=1 ./tests -run "TestPipeline"

  e2e:
    name: 6. End-to-End Scenarios
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Full Lifecycle E2E Scenarios
        run: go test -v -count=1 ./tests -run "TestE2E"

  leak-security:
    name: 7. Leak & Security Checks
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Security Hardening & Isolation
        run: go test -v -count=1 ./tests -run "TestSecurity"
      - name: Memory & Goroutine Leak Assertions
        run: go test -v -count=1 ./tests -run "TestMemoryScale|MemoryScale"

  sbom:
    name: 8. Software Bill of Materials (SBOM)
    needs: [leak-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build Binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o agentd ./cmd/agentd
      - name: Generate CycloneDX SBOM
        run: |
          go run scripts/sbom/main.go agentd sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: agentd-sbom
          path: sbom.json

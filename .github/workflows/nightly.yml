name: Nightly Suite

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-evaluation:
    name: 1. Repair Evaluation Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run Repair Evaluation Harness
        run: go test -v -count=1 ./tests -run "TestRepairEval|RepairEvaluationHarness"

  soak-benchmark:
    name: 2. 12-Hour Soak Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run 12-Hour Soak Test (500 checks, 2000 runs)
        run: go test -v -count=1 ./tests -run "TestPerformance_Soak12Hours"
